<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- 外框 -->
  <rect x="4" y="4" width="40" height="40" fill="none" stroke="#E8751A" stroke-width="3"/>
  <!-- 内部网格 -->
  <line x1="20" y1="4" x2="20" y2="44" stroke="#E8751A" stroke-width="0.8" opacity="0.5"/>
  <line x1="28" y1="4" x2="28" y2="44" stroke="#E8751A" stroke-width="0.8" opacity="0.5"/>
  <line x1="4" y1="20" x2="44" y2="20" stroke="#E8751A" stroke-width="0.8" opacity="0.5"/>
  <line x1="4" y1="28" x2="44" y2="28" stroke="#E8751A" stroke-width="0.8" opacity="0.5"/>
  <!-- 中心火焰图标 -->
  <circle cx="24" cy="22" r="6" fill="#E8751A" opacity="0.6"/>
  <circle cx="24" cy="22" r="3" fill="#FF9933"/>
  <!-- 出料口箭头（顶边3个） -->
  <polygon points="12,2 14,6 10,6" fill="#FFCC00"/>
  <polygon points="24,2 26,6 22,6" fill="#FFCC00"/>
  <polygon points="36,2 38,6 34,6" fill="#FFCC00"/>
  <!-- 进料口箭头（底边3个） -->
  <polygon points="12,46 14,42 10,42" fill="#FFCC00"/>
  <polygon points="24,46 26,42 22,42" fill="#FFCC00"/>
  <polygon points="36,46 38,42 34,42" fill="#FFCC00"/>
  <!-- 液体输入口（左边） -->
  <circle cx="2" cy="24" r="3" fill="none" stroke="#44AAFF" stroke-width="1.5"/>
  <polygon points="2,24 6,22 6,26" fill="#44AAFF"/>
  <!-- 液体输出口（右边） -->
  <circle cx="46" cy="24" r="3" fill="none" stroke="#44AAFF" stroke-width="1.5"/>
  <polygon points="46,24 42,22 42,26" fill="#44AAFF"/>
</svg>
